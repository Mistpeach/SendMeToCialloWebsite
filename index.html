<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciallo～ (∠・ω< )⌒★ 送我去柚子社的世界！</title>
    <style>
        :root {
            --pink: #f8a4c8;
            --pink-light: #ffd1e3;
            --pink-dark: #e887aa;
            --white: #fff5f9;
            --text: #6b3a50;
            --shadow: 0 4px 15px rgba(232, 135, 170, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe0ec 0%, #ffc8dd 25%, #fbb1d1 50%, #ffd1e3 75%, #ffe0ec 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            cursor: default;
            position: relative;
        }

        /* ========== 加载遮罩 ========== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffe0ec 0%, #ffc8dd 25%, #fbb1d1 50%, #ffd1e3 75%, #ffe0ec 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            gap: 24px;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-cat {
            font-size: 60px;
            animation: loadingBounce 0.8s ease-in-out infinite;
        }

        @keyframes loadingBounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-16px);
            }
        }

        .loading-text {
            font-size: 1.2rem;
            color: #d4567e;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
        }

        .loading-dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f8a4c8;
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: 0s;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        /* ========== 飘落樱花 ========== */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sakura {
            position: absolute;
            top: -60px;
            animation: sakuraFall linear infinite;
            opacity: 0.8;
            font-size: 24px;
            filter: drop-shadow(0 0 4px rgba(255, 150, 180, 0.5));
        }

        @keyframes sakuraFall {
            0% {
                transform: translateY(-60px) rotate(0deg) translateX(0px);
                opacity: 0.9;
            }
            25% {
                transform: translateY(25vh) rotate(90deg) translateX(30px);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(-20px);
                opacity: 0.7;
            }
            75% {
                transform: translateY(75vh) rotate(270deg) translateX(25px);
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-10px);
                opacity: 0.3;
            }
        }

        /* ========== 星星气泡 ========== */
        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            animation: bubbleRise linear infinite;
            opacity: 0.6;
            font-size: 20px;
        }

        @keyframes bubbleRise {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-110vh) translateX(40px) scale(0.3);
                opacity: 0;
            }
        }

        /* ========== 主容器 ========== */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 2px solid rgba(255, 180, 200, 0.5);
            box-shadow: 0 8px 40px rgba(232, 135, 170, 0.25), 0 0 80px rgba(255, 180, 210, 0.15);
            max-width: 600px;
            width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .main-container:hover {
            box-shadow: 0 12px 50px rgba(232, 135, 170, 0.35), 0 0 100px rgba(255, 180, 210, 0.25);
        }

        /* ========== 装饰猫耳 ========== */
        .cat-ears {
            position: absolute;
            top: -36px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 120px;
            pointer-events: none;
        }

        .cat-ear {
            font-size: 48px;
            animation: earWiggle 2s ease-in-out infinite;
            filter: drop-shadow(0 2px 6px rgba(232, 135, 170, 0.5));
        }

        .cat-ear:nth-child(1) {
            animation-delay: 0s;
        }
        .cat-ear:nth-child(2) {
            animation-delay: 0.3s;
        }

        @keyframes earWiggle {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(-8deg) scale(1.08);
            }
            75% {
                transform: rotate(8deg) scale(1.08);
            }
        }

        /* ========== 标题区域 ========== */
        .title-area {
            text-align: center;
            position: relative;
        }

        .main-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: #d4567e;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 150, 180, 0.5);
            letter-spacing: 3px;
            line-height: 1.4;
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .sub-title {
            font-size: 1.1rem;
            color: #c47a90;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 6px;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.6);
        }

        .kaomoji-decor {
            font-size: 1.2rem;
            color: #e887aa;
            margin-top: 8px;
            animation: sparkleText 1.5s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes sparkleText {
            0%, 100% {
                opacity: 0.8;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* ========== 分割线 ========== */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 70%;
            color: #e887aa;
            font-size: 1rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f8a4c8, transparent);
            border-radius: 1px;
        }

        /* ========== 一键Ciallo按钮 ========== */
        .btn-wrapper {
            position: relative;
        }

        .btn-ciallo {
            display: inline-block;
            padding: 20px 56px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, #ff7eb3, #ff5288, #ff3d73);
            background-size: 200% 200%;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            position: relative;
            letter-spacing: 4px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 30px rgba(255, 70, 120, 0.45), 0 4px 0 #d43d60, 0 8px 0 #b02e4a;
            transition: all 0.15s ease;
            animation: btnPulse 2s ease-in-out infinite;
            outline: none;
            font-family: inherit;
        }

        .btn-ciallo:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 14px 40px rgba(255, 70, 120, 0.6), 0 6px 0 #d43d60, 0 10px 0 #b02e4a;
            background: linear-gradient(135deg, #ff90c2, #ff6399, #ff4d82);
            background-size: 200% 200%;
            animation: btnPulse 1s ease-in-out infinite, gradientSweep 2s linear infinite;
        }

        .btn-ciallo:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 4px 15px rgba(255, 70, 120, 0.5), 0 2px 0 #d43d60, 0 4px 0 #b02e4a;
        }

        @keyframes btnPulse {
            0%, 100% {
                box-shadow: 0 8px 30px rgba(255, 70, 120, 0.45), 0 4px 0 #d43d60, 0 8px 0 #b02e4a;
            }
            50% {
                box-shadow: 0 8px 40px rgba(255, 70, 120, 0.65), 0 4px 0 #d43d60, 0 8px 0 #b02e4a, 0 0 60px rgba(255, 100, 150, 0.4);
            }
        }

        @keyframes gradientSweep {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* 按钮周围星星粒子 */
        .btn-sparkles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: 120%;
            height: 150%;
        }

        .sparkle {
            position: absolute;
            font-size: 18px;
            animation: sparkleBurst 1.8s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes sparkleBurst {
            0%, 100% {
                opacity: 0;
                transform: translate(0, 0) scale(0);
            }
            30% {
                opacity: 1;
            }
            60% {
                opacity: 0.6;
                transform: translate(var(--sx), var(--sy)) scale(1.3);
            }
            100% {
                opacity: 0;
                transform: translate(var(--sx), var(--sy)) scale(0);
            }
        }

        /* ========== 提示语 ========== */
        .hint-text {
            font-size: 0.95rem;
            color: #c47a90;
            text-align: center;
            line-height: 1.6;
            font-weight: 500;
        }

        .hint-text .highlight {
            color: #d4567e;
            font-weight: 700;
        }

        /* ========== 投稿按钮 ========== */
        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #d4567e;
            background: rgba(255, 255, 255, 0.6);
            border: 2px dashed #f8a4c8;
            border-radius: 40px;
            cursor: pointer;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: inherit;
        }

        .btn-submit:hover {
            background: rgba(255, 200, 220, 0.7);
            border-color: #ff7eb3;
            border-style: solid;
            color: #c42e5a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 120, 160, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(255, 120, 160, 0.2);
        }

        /* ========== 底部 ========== */
        .footer {
            font-size: 0.8rem;
            color: #d4a0b0;
            text-align: center;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .footer .heart {
            display: inline-block;
            animation: heartBeat 1.2s ease-in-out infinite;
            color: #ff6b8a;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.3);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.2);
            }
            60% {
                transform: scale(1);
            }
        }

        /* ========== 跳跃提示 toast ========== */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #f8a4c8;
            border-radius: 24px;
            padding: 14px 28px;
            font-size: 1.1rem;
            color: #d4567e;
            font-weight: 700;
            box-shadow: 0 6px 24px rgba(232, 135, 170, 0.3);
            z-index: 100;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .main-title {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }
            .sub-title {
                font-size: 0.9rem;
            }
            .btn-ciallo {
                padding: 16px 40px;
                font-size: 1.4rem;
                letter-spacing: 2px;
            }
            .main-container {
                padding: 28px 20px;
                gap: 16px;
                border-radius: 24px;
            }
            .cat-ears {
                gap: 80px;
                top: -28px;
            }
            .cat-ear {
                font-size: 36px;
            }
            .kaomoji-decor {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-cat">🐱</div>
        <div class="loading-text">Ciallo～ 资源加载中...</div>
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- 樱花飘落 -->
    <div class="sakura-container" id="sakuraContainer"></div>

    <!-- 星星气泡 -->
    <div class="bubble-container" id="bubbleContainer"></div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 猫耳装饰 -->
        <div class="cat-ears">
            <span class="cat-ear">🐱</span>
            <span class="cat-ear">🐱</span>
        </div>

        <!-- 标题 -->
        <div class="title-area">
            <h1 class="main-title">送我去柚子社的世界！</h1>
            <p class="sub-title">Send Me To A Ciallo Website!</p>
            <p class="kaomoji-decor">Ciallo～ (∠・ω< )⌒★</p>
        </div>

        <!-- 分割线 -->
        <div class="divider">🌸</div>

        <!-- 按钮区域 -->
        <div class="btn-wrapper">
            <button class="btn-ciallo" id="btnCiallo" title="Ciallo～ (∠・ω< )⌒★">
                一键Ciallo
            </button>
            <!-- 按钮周围星星 -->
            <div class="btn-sparkles">
                <span class="sparkle" style="top:10%;left:5%;--sx:-35px;--sy:-40px;animation-delay:0s;">✨</span>
                <span class="sparkle" style="top:5%;right:5%;--sx:35px;--sy:-35px;animation-delay:0.3s;">⭐</span>
                <span class="sparkle" style="bottom:10%;left:2%;--sx:-40px;--sy:30px;animation-delay:0.6s;">💖</span>
                <span class="sparkle" style="bottom:5%;right:8%;--sx:30px;--sy:38px;animation-delay:0.9s;">✨</span>
                <span class="sparkle" style="top:40%;left:-8%;--sx:-45px;--sy:0px;animation-delay:1.2s;">💕</span>
                <span class="sparkle" style="top:35%;right:-6%;--sx:42px;--sy:5px;animation-delay:1.5s;">⭐</span>
            </div>
        </div>

        <!-- 提示文字 -->
        <p class="hint-text">
            点击按钮，随机传送到一个<br>
            <span class="highlight">柚子社 / Ciallo / 綾地寧々</span> 相关网页<br>
        </p>

        <!-- 投稿链接 -->
        <a class="btn-submit" href="https://www.bilibili.com" target="_blank" rel="noopener noreferrer">
            📮 链接投稿
        </a>

        <!-- 底部 -->
        <div class="footer">
            Ciallo～ (∠・ω< )⌒★ <span class="heart">💗</span> 
        </div>
    </div>

    <!-- 隐藏音频 -->
    <audio id="audioCiallo" src="./res/audio.mp3" preload="auto"></audio>

    <script>
        // ========================
        // URL 列表 - 在此添加/修改链接
        // ========================
        const urlList = [
            'https://ciallo.cc/',
            'https://0d00.cn/',
            'https://ciallo.com.cn/',
            'https://ciallo.mikoto.zip/',
            'https://ciallo.surface233.top/',
            'https://www.bilibili.com/video/BV1pC411r7mU/',
            'https://www.bilibili.com/video/BV1Lz4y1v7xa/',
            'https://www.bilibili.com/video/BV1kDuDzXEUX/',
            'https://www.bilibili.com/video/BV1wLunzKEoW/',
            'https://www.bilibili.com/video/BV1Ke411e7xA/',
            'https://www.bilibili.com/video/BV16NgazvE98/',
            'https://www.bilibili.com/video/BV18WKW6iERX/',
            'https://www.bilibili.com/video/BV1rZ421B7mn/',
            'https://www.bilibili.com/video/BV1HM4m117fJ/',
            'https://www.bilibili.com/video/BV1Hg4y1r7LT/',
            'https://www.bilibili.com/video/BV1eH4y1u7iN/',
            'https://www.bilibili.com/video/BV1iN4y1v7nB/',
        ];

        // ========================
        // DOM 元素
        // ========================
        const btnCiallo = document.getElementById('btnCiallo');
        const audioCiallo = document.getElementById('audioCiallo');
        const toast = document.getElementById('toast');

        // ========================
        // 随机跳转
        // ========================
        function getRandomUrl() {
            const idx = Math.floor(Math.random() * urlList.length);
            return urlList[idx];
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function handleCiallo() {
            // 播放音频
            const audioPromise = audioCiallo.play();
            if (audioPromise !== undefined) {
                audioPromise.catch(() => {
                    // 音频可能因用户未交互或文件不存在而失败，静默处理
                    console.log('Ciallo～ 音频播放失败（可能文件不存在），但不影响跳转 (∠・ω< )⌒★');
                });
            }

            // 随机选一个 URL
            const targetUrl = getRandomUrl();

            // 显示提示
            const messages = [
                'Ciallo～ 传送中 (∠・ω< )⌒★',
                '猛男出征，寸草不生！',
                '正在撕裂时空前往柚子社...',
                '真男人从不回头看爆炸 💥',
                '宁宁等我！！！🏃💨',
                '柚子厨，集合！🍊',
                'Ciallo～ 世界线变动中...',
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            showToast(randomMsg);

            // 短暂延迟后跳转，留时间给音频和 toast
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        }

        // ========================
        // 事件绑定
        // ========================
        btnCiallo.addEventListener('click', handleCiallo);

        // 键盘回车也可以触发（按钮聚焦时）
        btnCiallo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                handleCiallo();
            }
        });

        // ========================
        // 生成飘落樱花
        // ========================
        function createSakura() {
            const container = document.getElementById('sakuraContainer');
            const sakuraTypes = ['🌸', '💮', '🌺', '✿', '❀', '🌷'];
            const count = 20;

            for (let i = 0; i < count; i++) {
                const petal = document.createElement('span');
                petal.className = 'sakura';
                petal.textContent = sakuraTypes[Math.floor(Math.random() * sakuraTypes.length)];
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 8 + 8) + 's';
                petal.style.animationDelay = Math.random() * 10 + 's';
                petal.style.fontSize = (Math.random() * 16 + 18) + 'px';
                container.appendChild(petal);
            }
        }

        // ========================
        // 生成气泡（星星和爱心）
        // ========================
        function createBubbles() {
            const container = document.getElementById('bubbleContainer');
            const bubbleTypes = ['✨', '⭐', '💖', '💕', '💝', '🌟', '♪', '♡', '✧'];
            const count = 15;

            for (let i = 0; i < count; i++) {
                const bubble = document.createElement('span');
                bubble.className = 'bubble';
                bubble.textContent = bubbleTypes[Math.floor(Math.random() * bubbleTypes.length)];
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = (Math.random() * 8 + 6) + 's';
                bubble.style.animationDelay = Math.random() * 8 + 's';
                bubble.style.fontSize = (Math.random() * 14 + 14) + 'px';
                container.appendChild(bubble);
            }
        }

        // ========================
        // 加载资源后显示页面
        // ========================
        function waitForAudioLoad() {
            return new Promise((resolve) => {
                // 如果音频已经加载完成（readyState >= 2 表示有足够数据播放）
                if (audioCiallo.readyState >= 2) {
                    resolve();
                    return;
                }

                // 监听 canplaythrough 事件
                audioCiallo.addEventListener('canplaythrough', () => {
                    resolve();
                }, { once: true });

                // 监听 load 事件
                audioCiallo.addEventListener('loadeddata', () => {
                    resolve();
                }, { once: true });

                // 兜底：如果音频加载出错（比如文件不存在），超时后也显示界面
                audioCiallo.addEventListener('error', () => {
                    console.log('Ciallo～ 音频加载失败（文件可能不存在），直接进入 (∠・ω< )⌒★');
                    resolve();
                }, { once: true });

                // 超时兜底：最多等 5 秒
                setTimeout(() => {
                    resolve();
                }, 5000);
            });
        }

        function showPage() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('hidden');
            // 加载遮罩隐藏后，从 DOM 中移除（可选，释放内存）
            loadingOverlay.addEventListener('transitionend', () => {
                loadingOverlay.remove();
            }, { once: true });
        }

        // ========================
        // 初始化
        // ========================
        async function init() {
            createSakura();
            createBubbles();

            // 等待音频加载完成
            await waitForAudioLoad();

            // 显示页面
            showPage();
        }

        init();
    </script>
</body>
</html>
